[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jka-antivirus"
version = "0.4.0"
description = "jka_antivirus: layered Windows antivirus engine (concurrent scanning, real-time watch, AI-ready)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "pefile>=2023.2.7",
    "yara-python>=4.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "watchdog>=4.0.0",
]

[project.scripts]
jka = "jka_antivirus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jka_antivirus"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
    "types-pefile>=2023.2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "B008",   # typer uses Argument/Option in default values by design
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["jka_antivirus"]

[[tool.mypy.overrides]]
module = ["pefile", "yara"]
ignore_missing_imports = true
